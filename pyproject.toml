[build-system]
requires = ["setuptools", "wheel", "cython", "numpy<2"]
build-backend = "setuptools.build_meta"

[project]
description = "Functional Curation backend for the Modelling Web Lab"
name = "fc"
version = "0.1.0"
requires-python = ">= 3.6"
readme = "README.md"
license = "BSD-3-Clause"

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

maintainers = [
    { name = "WebLab Team", email = "kwabena.amponsah1@nottingham.ac.uk" },
]

dependencies = [
    "cellmlmanip",
    "cython",
    "Jinja2>=2.10",
    "matplotlib",
    "numexpr",
    "numpy<2",
    "pyparsing>=2.5, <3.4",
    "scipy",
    "setuptools",
    "tables",
]

[project.optional-dependencies]
dev = [
    "pytest-xdist[psutil]", # "line_profiler",
]

test = [
    "codecov",
    "flake8>=3.6",
    "pytest>=3.6",
    "pytest-cov",
    "pytest-profiling",
]

[project.urls]
Repository = "https://github.com/ModellingWebLab/weblab-fc"

[project.scripts]
fc_run = "fc.cli:run_protocol"
fc_extract_outputs = "fc.cli:extract_outputs"
fc_check_syntax = "fc.cli:check_syntax"

[tool.setuptools]
package-dir = { "" = "fc" }

[tool.pytest]
testpaths = ["test"]
norecursedirs = ["data"]

[tool.isort]
force_single_line = "False"
multi_line_output = 5
# ^ Hanging grid grouped
line_length = 120
known_first_party = "fc"
default_section = "THIRDPARTY"
order_by_type = "False"
not_skip = "__init__.py"
