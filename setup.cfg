[flake8]
max-line-length = 120

exclude =
    */data/*
    *.egg-info/*
    build
    pycml
    testoutput
    venv
    .venv

ignore =
    # allow empty line at end of file
    W391,
    # break before binary operator - allow either style
    W503,
    # break after binary operator - allow either style
    W504

python_files =
    Test*.py
    test_*.py
    *_test.py
    tests.py

addopts =
    -ra
    --strict
    --tb=short
